<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin comp board</title>
<style>
  html,body{margin:0;padding:0;background:#E2E2E8}
  .board{display:flex}
  iframe{width:449px;height:894px;border:0;display:block}
</style>
</head>
<body>
<div class="board">
  <iframe id="l" title="Left"></iframe>
  <iframe id="r" title="Right"></iframe>
</div>
<script>
  var p = new URLSearchParams(location.search);
  document.getElementById('l').src = (p.get('l') || 'admin-a-overview') + '.html';
  if (p.get('r')) document.getElementById('r').src = p.get('r') + '.html';
</script>
</body>
</html>
