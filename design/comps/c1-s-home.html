<body>
<div class="device"><div class="screen">

    <div class="hdr2 gut">

        <div class="hrow"><span class="kick">Open now</span><span class="tag wn"><span class="num">3</span>&nbsp;h&nbsp;<span class="num">10</span>&nbsp;m left</span></div>

    <div class="rows gut">
      <div class="row"><div class="grow"><div class="rowt one">Number systems</div><div class="meta">Thu 22 Oct</div></div><div class="trail"><div class="num">8/10</div></div></div>
      <div class="row"><div class="grow"><div class="rowt one">Polynomials</div><div class="meta">Mon 19 Oct</div></div><div class="trail"><div class="num">6/10</div></div></div>
