<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Student test</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css" integrity="sha384-GzhNOdwUkh38xzoNEY1vRdLr+w8q+bXEJsd/km6Ef61w1Kfk+lself6cn14ilrpO" crossorigin="anonymous">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="comp.css">
<link rel="stylesheet" href="v12.css">
<link rel="stylesheet" href="v14.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<script src="comp.js"></script>
</head>
<body>
<div class="device"><div class="screen">
  <div class="sbar"><span class="num">5:51</span><span class="ic"><i class="ph-light ph-cell-signal-full"></i><i class="ph-light ph-wifi-high"></i><i class="ph-light ph-battery-full"></i></span></div>
  <div class="body">

    <div class="tbar gut">
      <button class="circ" aria-label="Leave test"><i class="ph-light ph-x"></i></button>
      <div class="where"><div class="num">7 <span>/ 12</span> <i class="ph-light ph-caret-down" style="font-size:12px;color:var(--faint)"></i></div><div class="track"><i style="width:58%"></i></div></div>
      <div class="timer2"><i class="ph-light ph-timer"></i><span class="num">14:42</span></div>
    </div>

    <div class="gut">
      <div class="qhead"><span class="kick">Question <span class="num">7</span></span><button class="flagchip"><i class="ph-light ph-flag"></i>Flag</button></div>
      <p class="qbig">If <span class="m">x = 2,\ y = -1</span> is a solution of <span class="m">3x + ky = 4</span>, what is the value of <span class="m">k</span>?</p>
      <div class="opts2">
        <div class="opt3"><span class="ltr">A</span><span class="m">-2</span></div>
        <div class="opt3 sel"><span class="ltr">B</span><span class="m">2</span></div>
        <div class="opt3"><span class="ltr">C</span><span class="m">\tfrac{1}{2}</span></div>
        <div class="opt3"><span class="ltr">D</span><span class="m">10</span></div>
      </div>
    </div>

  </div>
  <div class="tfoot">
    <button class="circ lg" aria-label="Previous question"><i class="ph-light ph-arrow-left"></i></button>
    <button class="btn">Next question<i class="ph-light ph-arrow-right"></i></button>
  </div>
  <div class="gest"><i></i></div>
</div></div>
</body>
</html>
