<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI credit: add credit</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css" integrity="sha384-GzhNOdwUkh38xzoNEY1vRdLr+w8q+bXEJsd/km6Ef61w1Kfk+lself6cn14ilrpO" crossorigin="anonymous">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="comp.css">
<link rel="stylesheet" href="v12.css">
<link rel="stylesheet" href="v14.css">
<link rel="stylesheet" href="w1.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<script src="comp.js"></script>
</head>
<body>
<div class="device"><div class="screen">
  <div class="sbar"><span class="num">5:42</span><span class="ic"><i class="ph-light ph-cell-signal-full"></i><i class="ph-light ph-wifi-high"></i><i class="ph-light ph-battery-full"></i></span></div>
  <div class="body">
    <div class="back gut"><button class="circ" aria-label="Back"><i class="ph-light ph-arrow-left"></i></button></div>
    <div class="gut" style="margin-top:20px">
      <div class="kick">AI credit</div>
      <h1 class="title" style="margin-top:7px">Add credit</h1>
    </div>

    <p class="bod gut" style="margin-top:10px;color:var(--muted)">Your credit is added once the payment is checked.</p>
    <div class="srule"><span class="kick">Amount</span><span class="ln"></span></div>
    <div class="gut"><div class="amts">
      <button class="amtile"><span class="v num">₹100</span><span class="s">about 41 pages</span></button>
      <button class="amtile on"><span class="v num">₹250</span><span class="s">about 104 pages</span></button>
      <button class="amtile"><span class="v num">₹500</span><span class="s">about 208 pages</span></button>
      <button class="amtile"><span class="v num">₹1,000</span><span class="s">about 416 pages</span></button>
    </div></div>
    <div class="srule"><span class="kick">How to pay</span><span class="ln"></span></div>
    <div class="gut"><div class="lcard">
      <div class="step"><span class="sn num">1</span><div class="grow"><div class="t">Pay ₹250 by UPI to</div><div class="copyrow"><span class="val num">upi-id@bank</span><button class="cp"><i class="ph-light ph-copy"></i>Copy</button></div></div></div>
      <div class="step"><span class="sn num">2</span><div class="grow"><div class="t">Put this code in the payment note</div><div class="copyrow"><span class="val num">CR-7K3Q</span><button class="cp"><i class="ph-light ph-copy"></i>Copy</button></div></div></div>
      <div class="step"><span class="sn num">3</span><div class="grow"><div class="t">Come back and tap I have paid</div></div></div>
    </div></div>

  </div>
  <div class="sticky2"><button class="btn"><span>I have paid ₹250</span></button><div class="reason">The credit is added after the payment is checked.</div></div>
  <div class="gest"><i></i></div>
</div></div>
</body>
</html>
