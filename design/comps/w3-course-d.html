<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Course page, option D: start to finish strip</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css" integrity="sha384-GzhNOdwUkh38xzoNEY1vRdLr+w8q+bXEJsd/km6Ef61w1Kfk+lself6cn14ilrpO" crossorigin="anonymous">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="comp.css">
<link rel="stylesheet" href="v12.css">
<link rel="stylesheet" href="v14.css">
<link rel="stylesheet" href="w1.css">
<link rel="stylesheet" href="c1.css">
<link rel="stylesheet" href="w2.css">
<link rel="stylesheet" href="w3.css">
<script src="comp.js"></script>
</head>
<body>
<div class="device"><div class="screen">
  <div class="sbar"><span class="num">5:42</span><span class="ic"><i class="ph-light ph-cell-signal-full"></i><i class="ph-light ph-wifi-high"></i><i class="ph-light ph-battery-full"></i></span></div>
  <div class="body">
    <div class="back gut"><button class="circ" aria-label="Back"><i class="ph-light ph-arrow-left"></i></button></div>
    <div class="gut" style="margin-top:16px">
      <div class="kick">Course</div>
      <h1 class="title" style="margin-top:7px">Spoken English</h1>
      <div class="rename"><i class="ph-light ph-pencil-simple"></i><span>Rename course</span></div>
    </div>
    <div class="gut" style="margin-top:14px"><button class="btn"><i class="ph-light ph-plus"></i><span>Make a test</span></button></div>

    <div class="gut" style="margin-top:18px">
      <div class="flow">
        <div class="fs"><div class="fn num">1</div><div class="fl">Not posted</div></div>
        <i class="ph-light ph-caret-right fa"></i>
        <div class="fs on"><div class="fn num">1</div><div class="fl">Open now</div></div>
        <i class="ph-light ph-caret-right fa"></i>
        <div class="fs"><div class="fn num">1</div><div class="fl">Finished</div></div>
      </div>
    </div>
    <div class="gut rows" style="margin-top:12px">
      <div class="row"><div class="grow"><div class="rowt one">Everyday phrases</div><div class="meta">4 questions · closes tomorrow 11:32 pm</div></div><div class="tr2"><div class="num">1/2</div><div class="meta">handed in</div></div><i class="ph-light ph-caret-right chev"></i></div>
    </div>
    <div class="gut" style="margin-top:20px">
      <div class="box">
        <div class="bh"><span class="sect">People</span><span class="bc">2</span></div>
        <div class="br"><span class="av" style="--pc:#E0702B">CT</span><div class="grow"><div class="rowt one">Claude Test Student</div><div class="meta">2 tests written · average 38%</div></div><i class="ph-light ph-caret-right chev"></i></div>
        <div class="br"><span class="av" style="--pc:#D94A8C">TN</span><div class="grow"><div class="rowt one">Test Newcomer</div><div class="meta">No tests written yet</div></div><i class="ph-light ph-caret-right chev"></i></div>
        <div class="bf"><i class="ph-light ph-user-plus"></i><span>Add people</span></div>
      </div>
    </div>
  </div>
  <div class="gest"><i></i></div>
</div></div>
</body>
</html>
