<div class="device"><div class="screen">

  <div class="body">
    <div class="back gut"><button class="circ" aria-label="Back"><i class="ph-light ph-arrow-left"></i></button></div>

    <div class="gut" style="margin-top:14px">

      <h1 class="title" style="margin-top:7px">Priya Maths Classes</h1>

    <div class="gut" style="margin-top:16px"><div class="stat2">

    </div></div>
    <div class="srule"><span class="kick">Storage</span><span class="ln"></span></div>

      <div class="sh"><span class="lab">Library</span><span class="lab r">2 GB for each client</span></div>

      <div class="track"><i style="width:20%"></i></div>

        <div class="part">PDFs<b>38 · 390 MB</b></div>
        <div class="part">Photos<b>12 · 22 MB</b></div>
        <div class="part">Still uploading<b>1</b></div>
      </div>
    </div></div>
    <div class="gut" style="margin-top:10px"><div class="card fl">
      <div class="fr"><span>Question pictures</span><b>14 · 6 MB</b></div>
      <div class="fr"><span>Paper pages</span><b>96 · 210 MB</b></div>
