<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · AnyTutor</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<style>
  /* Self-contained, so it still looks right when the missing address is deep inside the site. */
  :root { --bg: #FAFAFB; --ink: #0E0E11; --muted: #8E8E99; --action: #0E0E11; --action-ink: #FAFAFB; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0C0C0F; --ink: #F4F4F7; --muted: #90909C; --action: #F4F4F7; --action-ink: #0E0E11; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 500 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -.01em; }
  main { padding: 40px 20px; max-width: 30em; }
  .kick { font-size: 12px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  h1 { font-size: clamp(32px, 7vw, 44px); font-weight: 800; letter-spacing: -.05em; line-height: 1.05; margin: 0; }
  p { color: var(--muted); }
  a { display: inline-flex; align-items: center; min-height: 52px; padding: 0 22px; border-radius: 14px; margin-top: 12px;
      background: var(--action); color: var(--action-ink); font-weight: 700; text-decoration: none; letter-spacing: -.03em; }
  a:focus-visible { outline: 2px solid #5B3DF5; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="kick">AnyTutor</p>
  <h1>This page does not exist.</h1>
  <p>The address may have a typing mistake, or the page has moved.</p>
  <a href="/">Go to the home page</a>
</main>
</body>
</html>
